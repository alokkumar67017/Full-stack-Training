<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Theme Toggle</title>

    <style>
        .dark {
            background: rgb(191, 34, 34);
            color: rgb(255, 255, 255);
        }

        button {
            padding: 10px 20px;
        }
    </style>
</head>

<body>

    <h1>Theme Toggle Project</h1>

    <p>JavaScript DOM Dynamic Styling</p>

    <button id="theme">Change Theme</button>

    <script>

        let button = document.getElementById("theme");

        button.addEventListener("click", function () {

            document.body.classList.toggle("dark");

        });

    </script>

</body>
</html>
